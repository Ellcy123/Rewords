interface:
  display_name: "Unity MCP UI Layout"
  short_description: "Unity UI snapshot, layer/tree, candidate-ledger, and item-rect layout via MCP."
  default_prompt: "Use $unity-mcp-ui-layout to repair or build Unity UI through staged, layout-focused edits. Trigger it for attached UI mockups, mockup screenshots, uploaded design images, dropped design images, reference images, UI 시안, 시안 던져줄게, and requests to turn, convert, make, generate, or create Unity UI prefabs or 프리팹 from a design. Before using prefab or Canvas defaults, route explicit UI Toolkit requests, a selected UIDocument, a resolved visual-tree root, or an editor UI Toolkit owner to UI Toolkit. Treat UXML/USS and PanelSettings as corroborating only when referenced by that owner. For existing Unity UI, capture a layout snapshot or equivalent smaller-call evidence first: target surface, Unity version evidence, selection.selected_object, selection.active_ui_root, UI stack, root layout owners, screenshot frame, and console state. For designs, run a layer-to-layout-tree pass first: identify 레이어 구조, 트리 구조, parent-owned regions, reusable groups, runtime leaves, decorative image layers, candidate item ledger entries, and item-level UI rect plans before creating objects. Realize the approved tree through UGUI Transform/RectTransform hierarchy, anchors, layout components, and prefab roots, or through a UI Toolkit visual tree, UXML templates/VisualTreeAsset, flex/style owners, and an optional behavior owner. For new screens, resolve open design and structure choices with sequential questions while honoring prior answers. With a mockup, inspect and reuse suitable project images even without an asset index; ask about temporary-resource generation and generate only when the agent has an available image-generation skill and its execution requirements are met, then import, apply, and visually verify agreed outputs. Without that skill, skip generation questions and generation even if a standalone image tool exists. Before delegation, read references/agent-capability-routing.md and verify each executing session: do not inherit parent skills, tools, vision, or artifact access by assumption. Assign text-only workers approved structured handoffs and route actual image analysis and final visual QA to verified visual owners. Read design tokens before styling, and verify with screenshots."
